<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload Lecture · VLSI LMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body class="role-teacher">
<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="index.html">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg></span>
      <span><b>VLSI LMS</b><small>Instructor portal</small></span>
    </a>
    <nav>
      <a href="index.html"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>My Lectures</span></a>
      <a href="upload.html" class="on"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><span>Upload / Submit Lecture</span></a>
    </nav>
    <div class="sidebar-footer">
      <a href="../login.html" onclick="window.LMS.signOut(); return false;" style="display: flex; align-items: center; gap: 8px; color: #f87171; font-weight: 500;">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Sign Out</span>
      </a>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <h1>Upload &amp; Submit Lecture</h1>
      <div class="top-user">
        <a href="index.html" class="btn btn-sm">Cancel</a>
      </div>
    </header>

    <main class="content">
      <div class="card narrow">
        <form id="lectureUploadForm" class="form" onsubmit="return handleLectureUpload(event);">
          <label>Lecture Title
            <input type="text" id="lecTitle" required placeholder="e.g. Lec 04: Multi-Corner Multi-Mode (MCMM) Setup">
          </label>

          <div class="grid-2">
            <label>Target Cohort Batch
              <select id="lecBatch" required onchange="filterSubjectsByBatch(this.value)"></select>
            </label>
            <label>Subject / Module
              <select id="lecSubject" required></select>
            </label>
          </div>

          <label>Video URL / Embed Link (YouTube, Vimeo, Cloud Storage or MP4)
            <input type="text" id="lecVideoUrl" required placeholder="https://www.youtube.com/embed/gOo57e69_B8" value="https://www.youtube.com/embed/gOo57e69_B8">
          </label>

          <div class="grid-2">
            <label>Estimated Duration (Minutes)
              <input type="number" id="lecDuration" value="60" min="1" required>
            </label>
            <label>Class Notes URL (PDF or Markdown)
              <input type="text" id="lecNotes" placeholder="https://domain.com/notes.pdf">
            </label>
          </div>

          <label>Lab Exercises &amp; Verilog Testbenches Archive (Optional)
            <input type="text" id="lecLab" placeholder="https://domain.com/lab.tar.gz">
          </label>

          <label>Detailed Lecture Description
            <textarea id="lecDesc" rows="4" placeholder="Brief outline of concepts covered, prerequisite slides, and lab assignments..."></textarea>
          </label>

          <div style="margin-top: 20px; display: flex; gap: 12px; align-items: center;">
            <button class="btn btn-primary" type="submit">Submit Lecture for Admin Review</button>
            <span class="small muted">Administrators will verify the recording before publishing to students.</span>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>

<div class="scrim" onclick="document.body.classList.remove('nav-open')"></div>
<script src="../assets/lms-data.js"></script>
<script src="../assets/app.js"></script>
<script>
  (function() {
    window.LMS.requireRole(['teacher', 'admin']);
    var db = window.LMS.getDb();
    var bSel = document.getElementById('lecBatch');
    db.batches.forEach(function(b) {
      var opt = document.createElement('option');
      opt.value = b.id;
      opt.textContent = b.code + ' (' + b.name + ')';
      bSel.appendChild(opt);
    });
    filterSubjectsByBatch(db.batches[0] ? db.batches[0].id : '');
  })();

  function filterSubjectsByBatch(batchId) {
    var db = window.LMS.getDb();
    var b = db.batches.find(function(x) { return x.id === batchId; });
    var sSel = document.getElementById('lecSubject');
    sSel.innerHTML = '';
    var subs = b ? db.subjects.filter(function(s) { return s.course_id === b.course_id; }) : db.subjects;
    subs.forEach(function(s) {
      var opt = document.createElement('option');
      opt.value = s.id;
      opt.textContent = s.name;
      sSel.appendChild(opt);
    });
  }

  function handleLectureUpload(e) {
    e.preventDefault();
    var title = document.getElementById('lecTitle').value;
    var batch = document.getElementById('lecBatch').value;
    var subject = document.getElementById('lecSubject').value;
    var videoUrl = document.getElementById('lecVideoUrl').value;
    var dur = parseInt(document.getElementById('lecDuration').value, 10) * 60;
    var notes = document.getElementById('lecNotes').value || null;
    var lab = document.getElementById('lecLab').value || null;
    var desc = document.getElementById('lecDesc').value;

    var user = window.LMS.getCurrentUser();
    var db = window.LMS.getDb();

    var newLec = {
      id: 'lec_' + Date.now(),
      batch_id: batch,
      subject_id: subject,
      teacher_id: user.id,
      teacher_name: user.name || 'Instructor',
      title: title.trim(),
      description: desc.trim(),
      video_type: 'youtube',
      video_url: videoUrl.trim(),
      duration_seconds: dur,
      notes_url: notes,
      lab_url: lab,
      status: 'submitted',
      created_at: new Date().toISOString().replace('T', ' ').substring(0, 19)
    };

    db.lectures.push(newLec);
    db.audit_logs.unshift({
      id: 'log_' + Date.now(),
      actor: user.email,
      action: 'Uploaded Lecture',
      details: title + ' submitted for review',
      created_at: new Date().toISOString().replace('T', ' ').substring(0, 19)
    });
    window.LMS.saveDb(db);
    alert('Lecture submitted successfully! It has been placed in the Admin Review queue.');
    window.location.href = 'index.html';
    return false;
  }
</script>
</body>
</html>
