  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <h1 id="pageTitle">Users Roster</h1>
      <div class="top-user">
        <button class="btn btn-primary btn-sm" onclick="showAddUserModal()">+ Add User</button>
      </div>
    </header>

    <main class="content">
      <div class="toolbar">
        <div class="filters">
          <input type="search" placeholder="Search user by name or email..." oninput="filterUsers(this.value)">
        </div>
      </div>

      <section class="card flush">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>User / Name</th>
                <th>Email Address</th>
                <th>Role</th>
                <th>Assigned Batch</th>
                <th>Status</th>
                <th class="right">Action</th>
              </tr>
            </thead>
            <tbody id="usersTbody">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>

<div class="scrim" onclick="document.body.classList.remove('nav-open')"></div>
<script src="../assets/lms-data.js"></script>
<script src="../assets/app.js"></script>
<script>
  var currentRole = 'student';
  (function() {
    window.LMS.requireRole(['admin']);
    var urlParams = new URLSearchParams(window.location.search);
    currentRole = urlParams.get('role') || 'student';

    if (currentRole === 'teacher') {
      document.getElementById('navTeachers').classList.add('on');
      document.getElementById('pageTitle').textContent = 'Faculty & Instructors';
    } else {
      document.getElementById('navStudents').classList.add('on');
      document.getElementById('pageTitle').textContent = 'Enrolled Students';
    }
    renderUsers();
  })();

  function renderUsers() {
    var db = window.LMS.getDb();
    var list = db.users.filter(function(u) { return u.role === currentRole; });
    var tbody = document.getElementById('usersTbody');
    tbody.innerHTML = '';

    list.forEach(function(u) {
      var batch = db.batches.find(function(b) { return b.id === u.batch_id; }) || { code: 'Unassigned', name: 'None' };
      var tr = document.createElement('tr');
      tr.innerHTML = `
        <td><b>${u.name || 'User'}</b></td>
        <td><code>${u.email}</code></td>
        <td><span class="badge ${u.role === 'teacher' ? 'badge-blue' : 'badge-green'}">${u.role.toUpperCase()}</span></td>
        <td>${batch.code} <small class="muted">(${batch.name})</small></td>
        <td><span class="badge badge-green">Active</span></td>
        <td class="right">
          <button class="btn btn-sm" onclick="reassignBatch('${u.id}')">Change Batch</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function filterUsers(query) {
    var q = query.toLowerCase().trim();
    document.querySelectorAll('#usersTbody tr').forEach(function(r) {
      r.style.display = (r.textContent.toLowerCase().indexOf(q) !== -1 || !q) ? '' : 'none';
    });
  }

  function showAddUserModal() {
    var name = prompt('Enter Full Name:');
    if (!name) return;
    var email = prompt('Enter Email Address:');
    if (!email) return;

    var db = window.LMS.getDb();
    db.users.push({
      id: 'u_' + Date.now(),
      name: name.trim(),
      email: email.trim(),
      role: currentRole,
      batch_id: 'b1'
    });
    window.LMS.saveDb(db);
    renderUsers();
  }

  function reassignBatch(uid) {
    var db = window.LMS.getDb();
    var u = db.users.find(function(x) { return x.id === uid; });
    if (!u) return;
    var bList = db.batches.map(function(b, i) { return (i+1) + '. ' + b.code + ' (' + b.name + ')'; }).join('\n');
    var pick = prompt('Assign to Batch:\n' + bList, '1');
    if (!pick) return;
    var batch = db.batches[parseInt(pick, 10) - 1];
    if (batch) {
      u.batch_id = batch.id;
      window.LMS.saveDb(db);
      renderUsers();
    }
  }
</script>
</body>
