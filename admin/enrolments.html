<div class="scrim" onclick="document.body.classList.remove('nav-open')"></div>
<script src="../assets/lms-data.js"></script>
<script src="../assets/app.js"></script>
<script>
  (function() {
    window.LMS.requireRole(['admin']);
    var db = window.LMS.getDb();
    var students = db.users.filter(function(u) { return u.role === 'student'; });
    var tbody = document.getElementById('enrolTbody');
    tbody.innerHTML = '';

    students.forEach(function(s) {
      var b = db.batches.find(function(x) { return x.id === s.batch_id; }) || { code: 'PD-NOV-2026-WKND', name: 'PD Weekend', course_id: 'c1' };
      var c = db.courses.find(function(x) { return x.id === b.course_id; }) || { title: 'Physical Design' };
      var tr = document.createElement('tr');
      tr.innerHTML = `
        <td><b>${s.name || s.email}</b><div class="small muted">${s.email}</div></td>
        <td><code>${b.code}</code><div class="small muted">${b.name}</div></td>
        <td>${c.title}</td>
        <td class="small muted">Active Enrolment</td>
        <td><span class="badge badge-green">Enrolled</span></td>
      `;
      tbody.appendChild(tr);
    });
  })();
</script>
