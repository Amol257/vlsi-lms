<script src="../assets/lms-data.js"></script>
<script src="../assets/app.js"></script>
<script>
  (function() {
    window.LMS.requireRole(['admin']);
    renderCourses();
  })();

  function renderCourses() {
    var db = window.LMS.getDb();
    var tbody = document.getElementById('courseTbody');
    tbody.innerHTML = '';

    db.courses.forEach(function(c) {
      var subs = db.subjects.filter(function(s) { return s.course_id === c.id; });
      var bchs = db.batches.filter(function(b) { return b.course_id === c.id; });

      var tr = document.createElement('tr');
      tr.innerHTML = `
        <td><b>${c.code}</b></td>
        <td>
          <b>${c.title}</b>
          <div class="muted small">${c.duration} · ${c.desc || ''}</div>
        </td>
        <td class="num">${subs.length}</td>
        <td class="num">${bchs.length}</td>
        <td><span class="badge badge-green">Active</span></td>
        <td class="right nowrap">
          <button class="btn btn-sm" onclick="deleteCourse('${c.id}')" style="color: var(--red);">Delete</button>
        </td>
      `;
      tbody.appendChild(tr);
    });

    // Render Subjects by course
    var subWrap = document.getElementById('subjectCardsWrap');
    subWrap.innerHTML = '';
    db.courses.forEach(function(c) {
      var subs = db.subjects.filter(function(s) { return s.course_id === c.id; });
      var card = document.createElement('div');
      card.className = 'card';
      card.style.marginBottom = '0';
      var items = subs.map(function(s, idx) {
        return `<li style="padding: 8px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between;">
          <span><b>${idx+1}.</b> ${s.name}</span>
          <span class="small muted">Module ${s.order_idx}</span>
        </li>`;
      }).join('');

      card.innerHTML = `
        <div class="card-head">
          <h3>${c.title} (${c.code})</h3>
          <span class="badge badge-blue">${subs.length} Modules</span>
        </div>
        <ul style="list-style: none; padding: 0; margin: 0;">${items || '<li class="muted small">No subjects added yet.</li>'}</ul>
      `;
      subWrap.appendChild(card);
    });
  }

  function showNewCourseModal() {
    var code = prompt('Enter Course Code (e.g., ANALOG):');
    if (!code) return;
    var title = prompt('Enter Course Title (e.g., CMOS Analog Integrated Circuit Design):');
    if (!title) return;
    var duration = prompt('Enter Duration (e.g., 4 months):', '4 months');

    var db = window.LMS.getDb();
    db.courses.push({
      id: 'c_' + Date.now(),
      code: code.toUpperCase().trim(),
      title: title.trim(),
      duration: duration,
      status: 'active',
      desc: 'Hands-on semiconductor design coursework.'
    });
    window.LMS.saveDb(db);
    renderCourses();
  }

  function showNewSubjectModal() {
    var db = window.LMS.getDb();
    if (db.courses.length === 0) return alert('Create a course first.');
    var cList = db.courses.map(function(c, i) { return (i+1) + '. ' + c.code + ' (' + c.title + ')'; }).join('\n');
    var pick = prompt('Select Course by number:\n' + cList, '1');
    if (!pick) return;
    var cIndex = parseInt(pick, 10) - 1;
    var course = db.courses[cIndex] || db.courses[0];
    var subName = prompt('Enter Subject / Module Name:');
    if (!subName) return;

    db.subjects.push({
      id: 's_' + Date.now(),
      course_id: course.id,
      name: subName.trim(),
      order_idx: db.subjects.filter(function(s) { return s.course_id === course.id; }).length + 1
    });
    window.LMS.saveDb(db);
    renderCourses();
  }

  function deleteCourse(cid) {
    if (!confirm('Are you sure you want to delete this course and its subjects?')) return;
    var db = window.LMS.getDb();
    db.courses = db.courses.filter(function(c) { return c.id !== cid; });
    db.subjects = db.subjects.filter(function(s) { return s.course_id !== cid; });
    window.LMS.saveDb(db);
    renderCourses();
  }
</script>
