<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lecture Player · VLSI LMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body class="role-student">
<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="index.html">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg></span>
      <span><b>VLSI LMS</b><small>Student classroom</small></span>
    </a>
    <nav>
      <a href="index.html">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>My Batches</span>
      </a>
      <a href="player.html" class="on">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <span>Lecture Player</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <a href="../login.html" onclick="window.LMS.signOut(); return false;" style="display: flex; align-items: center; gap: 8px; color: #f87171; font-weight: 500;">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Sign Out</span>
      </a>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <h1 id="playerTopbarTitle">Lecture Player</h1>
      <div class="top-user">
        <a href="index.html" class="btn btn-sm">← Back to Dashboard</a>
      </div>
    </header>

    <main class="content">
      <div class="grid-side align-start">
        <!-- LEFT: VIDEO PLAYER & LESSON MATERIALS -->
        <div>
          <div class="player-wrap">
            <iframe id="classroomVideo" src="" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
          </div>

          <div class="card">
            <div class="card-head">
              <div>
                <h2 id="lecTitle" style="margin-bottom: 4px; font-size: 18px;">Lecture Title</h2>
                <span class="small muted" id="lecMeta">Instructor · Subject · Cohort</span>
              </div>
              <div class="mark-done" id="markDoneContainer" data-lecture="" data-duration="3600">
                <button class="btn btn-sm" id="btnMarkWatched" onclick="toggleWatched()">Mark as Watched</button>
                <span class="small muted" id="progressNote"></span>
              </div>
            </div>

            <div class="prose" id="lecDesc" style="margin-bottom: 16px;">
              Lecture description...
            </div>

            <div style="border-top: 1px solid var(--line); padding-top: 14px;">
              <h4 style="margin: 0 0 10px;">Downloads &amp; Lab Materials</h4>
              <ul class="files" id="studentFilesList">
                <!-- Dynamically populated -->
              </ul>
            </div>
          </div>
        </div>

        <!-- RIGHT: COURSE SYLLABUS & LECTURE PLAYLIST -->
        <div>
          <div class="card flush">
            <div class="card-head pad">
              <div>
                <h3 style="margin: 0;">Course Syllabus</h3>
                <span class="small muted" id="syllabusBatch">Cohort</span>
              </div>
            </div>
            <ul class="lecture-list compact" id="playlistUl">
              <!-- Dynamically populated -->
            </ul>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="scrim" onclick="document.body.classList.remove('nav-open')"></div>
<script src="../assets/lms-data.js"></script>
<script src="../assets/app.js"></script>
<script>
  var currentLecId = 'lec_1';
  (function() {
    window.LMS.requireRole(['student', 'admin', 'teacher']);
    var user = window.LMS.getCurrentUser();
    var db = window.LMS.getDb();
    var urlParams = new URLSearchParams(window.location.search);
    currentLecId = urlParams.get('lecture') || 'lec_1';

    var lec = db.lectures.find(function(l) { return l.id === currentLecId; }) || db.lectures[0];
    currentLecId = lec.id;

    var batch = db.batches.find(function(b) { return b.id === lec.batch_id; }) || db.batches[0];
    var subj = db.subjects.find(function(s) { return s.id === lec.subject_id; }) || { name: 'Module' };

    document.getElementById('playerTopbarTitle').textContent = lec.title;
    document.getElementById('lecTitle').textContent = lec.title;
    document.getElementById('lecMeta').textContent = lec.teacher_name + ' · ' + subj.name + ' · ' + batch.name;
    document.getElementById('lecDesc').textContent = lec.description || 'Hands-on live recorded session.';
    document.getElementById('classroomVideo').src = lec.video_url;
    document.getElementById('syllabusBatch').textContent = batch.name;

    // Check student progress
    var prog = db.progress.find(function(p) { return p.user_id === user.id && p.lecture_id === lec.id; });
    var markBtn = document.getElementById('btnMarkWatched');
    var pNote = document.getElementById('progressNote');
    if (prog && prog.is_completed) {
      markBtn.textContent = '✓ Watched';
      markBtn.classList.add('badge-green');
      pNote.textContent = ' · Completed ✓';
    } else if (prog) {
      pNote.textContent = ' · ' + prog.percent_watched + '% watched';
    }

    // Attachments
    var fWrap = document.getElementById('studentFilesList');
    fWrap.innerHTML = '';
    if (lec.notes_url) {
      fWrap.innerHTML += `<li><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><a href="${lec.notes_url}" target="_blank">Class Notes &amp; Slides (PDF)</a></li>`;
    }
    if (lec.lab_url) {
      fWrap.innerHTML += `<li><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><a href="${lec.lab_url}" target="_blank">Lab Testbenches &amp; Script Tarball (.tar.gz)</a></li>`;
    }
    if (!lec.notes_url && !lec.lab_url) {
      fWrap.innerHTML = '<li class="small muted">No files attached for this lecture.</li>';
    }

    // Render playlist
    var published = db.lectures.filter(function(l) { return l.batch_id === batch.id && l.status === 'published'; });
    var pUl = document.getElementById('playlistUl');
    pUl.innerHTML = '';

    published.forEach(function(l, idx) {
      var lProg = db.progress.find(function(p) { return p.user_id === user.id && p.lecture_id === l.id; });
      var isDone = lProg && lProg.is_completed;
      var isCur = l.id === currentLecId;

      var li = document.createElement('li');
      if (isCur) li.className = 'current';
      li.innerHTML = `
        <a href="player.html?lecture=${l.id}">
          <span class="ln ${isDone ? 'done' : ''}">${isDone ? '✓' : (idx+1)}</span>
          <span class="lt">
            <b>${l.title}</b>
            <span class="small muted">${l.teacher_name}</span>
          </span>
          <span class="lm">${Math.round(l.duration_seconds / 60)}m</span>
        </a>
      `;
      pUl.appendChild(li);
    });
  })();

  function toggleWatched() {
    var user = window.LMS.getCurrentUser();
    var res = window.LMS.updateLectureProgress(currentLecId, 3600, 3600, 'complete');
    var markBtn = document.getElementById('btnMarkWatched');
    markBtn.textContent = '✓ Watched';
    document.getElementById('progressNote').textContent = ' · Completed ✓';
    // re-render checkmark in playlist
    var doneLn = document.querySelector('.lecture-list li.current .ln');
    if (doneLn) {
      doneLn.className = 'ln done';
      doneLn.textContent = '✓';
    }
  }
</script>
</body>
</html>
