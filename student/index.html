<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Learning Portal · VLSI LMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body class="role-student">
<div class="shell">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <a class="brand" href="index.html">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg></span>
      <span><b>VLSI LMS</b><small>Student classroom</small></span>
    </a>
    <nav>
      <a href="index.html" class="on">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>My Batches</span>
      </a>
      <a href="player.html?lecture=lec_1">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <span>Lecture Player</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <a href="../login.html" onclick="window.LMS.signOut(); return false;" style="display: flex; align-items: center; gap: 8px; color: #f87171; font-weight: 500;">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Sign Out</span>
      </a>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <h1>Student Dashboard</h1>
      <div class="top-user">
        <div class="who">
          <span class="avatar">S</span>
          <span class="who-name">Student</span>
        </div>
      </div>
    </header>

    <main class="content">
      <!-- CONTINUE WATCHING BANNER -->
      <section class="card attention" id="continueCard" style="display: none;">
        <div class="course-hero">
          <div>
            <span class="badge badge-amber" style="margin-bottom: 8px;">Resume Lecture</span>
            <h2 id="continueTitle" style="margin-bottom: 6px;">Lecture Title</h2>
            <p id="continueSub" class="small muted" style="margin: 0;">Subject &amp; Cohort</p>
          </div>
          <div class="hero-progress">
            <b id="continuePct">79%</b>
            <span id="continueRemaining">Watched</span>
            <div class="progress-bar-wrap" style="margin-top: 8px; height: 8px;">
              <div class="fill" id="continueFill" style="width: 79%;"></div>
            </div>
            <a id="continueBtn" href="#" class="btn btn-primary btn-sm" style="margin-top: 10px;">▶ Resume Watching</a>
          </div>
        </div>
      </section>

      <!-- ENROLLED BATCHES & COURSES -->
      <h2>Enrolled Course Cohorts</h2>
      <div id="cohortGrid" class="grid-2" style="margin-bottom: 24px;">
        <!-- Dynamically populated -->
      </div>

      <!-- COHORT ANNOUNCEMENTS -->
      <h2>Announcements &amp; Live Lab Updates</h2>
      <div id="studentAnnList" style="display: flex; flex-direction: column; gap: 12px;">
        <!-- Dynamically populated -->
      </div>
    </main>
  </div>
</div>

<div class="scrim" onclick="document.body.classList.remove('nav-open')"></div>
<script src="../assets/lms-data.js"></script>
<script src="../assets/app.js"></script>
<script>
  (function() {
    window.LMS.requireRole(['student', 'admin', 'teacher']);
    var user = window.LMS.getCurrentUser();
    var db = window.LMS.getDb();

    // 1. Continue Watching
    var myProgress = db.progress.find(function(p) { return p.user_id === user.id && !p.is_completed; }) || db.progress[0];
    if (myProgress) {
      var lec = db.lectures.find(function(l) { return l.id === myProgress.lecture_id; });
      if (lec) {
        var card = document.getElementById('continueCard');
        card.style.display = 'block';
        document.getElementById('continueTitle').textContent = lec.title;
        document.getElementById('continueSub').textContent = lec.teacher_name + ' · ' + Math.round(myProgress.position_seconds / 60) + ' min watched';
        document.getElementById('continuePct').textContent = myProgress.percent_watched + '%';
        document.getElementById('continueFill').style.width = myProgress.percent_watched + '%';
        document.getElementById('continueBtn').href = 'player.html?lecture=' + lec.id;
      }
    }

    // 2. Enrolled Cohorts
    var batchId = user.batch_id || 'b1';
    var userBatch = db.batches.find(function(b) { return b.id === batchId; }) || db.batches[0];
    var userCourse = db.courses.find(function(c) { return c.id === userBatch.course_id; }) || db.courses[0];
    var batchLecs = db.lectures.filter(function(l) { return l.batch_id === userBatch.id && l.status === 'published'; });

    var cohortGrid = document.getElementById('cohortGrid');
    cohortGrid.innerHTML = `
      <div class="card class-card">
        <div class="card-head">
          <span class="badge badge-green">Enrolled &amp; Active</span>
          <span class="badge badge-grey">${userCourse.code}</span>
        </div>
        <h3>${userCourse.title}</h3>
        <p class="muted small">${userBatch.name}</p>
        <div class="mini-stats">
          <span>📅 ${userBatch.schedule}</span>
          <span>🎥 ${batchLecs.length} Lectures Available</span>
        </div>
        <div style="margin-top: 10px;">
          <a href="player.html?lecture=${batchLecs[0] ? batchLecs[0].id : 'lec_1'}" class="btn btn-primary btn-block">Enter Classroom &amp; Lectures →</a>
        </div>
      </div>
    `;

    // 3. Announcements
    var annWrap = document.getElementById('studentAnnList');
    annWrap.innerHTML = '';
    var anns = db.announcements.filter(function(a) { return !a.batch_id || a.batch_id === userBatch.id; });
    anns.forEach(function(a) {
      var c = document.createElement('div');
      c.className = 'card';
      c.style.marginBottom = '0';
      c.innerHTML = `
        <div class="card-head" style="margin-bottom: 6px;">
          <b>📢 ${a.title}</b>
          <span class="small muted">${a.created_at}</span>
        </div>
        <p class="small" style="color: var(--ink-2); margin: 0; white-space: pre-line;">${a.content}</p>
      `;
      annWrap.appendChild(c);
    });
  })();
</script>
</body>
</html>
